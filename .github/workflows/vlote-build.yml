name: VLote Windows build

on:
  push:
    branches: [ VLote ]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SpineViewer/SpineViewer.csproj -r win-x64 -p:Platform=x64
      - name: Publish Windows test build
        run: dotnet publish SpineViewer/SpineViewer.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o publish/VLote --no-restore
      - name: Upload VLote Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: SpineViewer-VLote-0.1-Windows
          path: publish/VLote/
          if-no-files-found: error
